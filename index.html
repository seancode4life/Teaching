*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;font-weight:600}
h1,h2,h3{margin:0;line-height:1.2}

.lang button.on{background:var(--acc);color:#fff}
main{max-width:1050px;margin:0 auto;padding:22px 20px 60px}
.grid{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}.card.hi{border:2px solid var(--acc)}

button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.small{color:var(--mut);font-size:14px;font-weight:700}

.step{display:flex;gap:12px;margin-top:12px}.step i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-style:normal;font-weight:900}.step p{margin:0;font-size:15px}
.exbar{display:flex;gap:14px;align-items:center;margin-bottom:16px}
#ex .card{max-width:680px;margin:0 auto}
.big{font-size:24px;font-weight:800;margin:14px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);border-radius:14px;padding:14px;font:inherit;font-weight:800;text-align:left;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.on{border-color:var(--acc);background:var(--soft)}
input{width:100%;font:inherit;font-size:22px;font-weight:800;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.ans{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.bank{display:flex;gap:8px;flex-wrap:wrap;min-height:50px}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;font-size:19px;font-weight:800;cursor:pointer}
.fb{border-radius:14px;padding:14px 18px;margin-top:14px;font-weight:800}.fb.ok{background:#d9f6ec;color:#07553f}.fb.no{background:#ffe3ea;color:#6a1030}

.sign{text-align:center;color:var(--mut);font-size:14px;margin-top:26px}

.opt.ok{border-color:var(--ok);background:#d9f6ec;color:#07553f}.opt.no{border-color:var(--bad);background:#ffe3ea;color:#6a1030}
.ow{display:flex;gap:6px}.ow .opt{flex:1}.sp{border:2px solid var(--line);border-bottom-width:4px;background:var(--soft);border-radius:12px;padding:0 12px;cursor:pointer;font-size:18px}.sq{padding:4px 12px;margin-left:8px;vertical-align:middle}

#ex .card{padding:28px;border-radius:26px}
.opt{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;border-radius:16px;min-height:66px;text-align:left}
.opt .ot{font-size:19px}.otr{font-size:14px;color:var(--mut);font-weight:600}.opt.on{box-shadow:0 0 0 4px var(--soft)}.opt.ok .otr{color:#2d7a5c}.opt.no .otr{color:#a3394f}

[0,'Subject + verb agreement','Özne ve fiil uyumu','<p>With <b>he, she, it</b> add <b>-s</b>: she <b>goes</b>. With <b>I, you, we, they</b> use the base verb: they <b>go</b>.</p><p>Be: I <b>am</b>, he/she/it <b>is</b>, you/we/they <b>are</b>. Past: I/he/she/it <b>was</b>, you/we/they <b>were</b>.</p><p>Use <b>a</b> before a consonant sound and <b>an</b> before a vowel sound: a book, an apple.</p>','<p><b>he, she, it</b> ile fiile <b>-s</b> eklenir: she <b>goes</b>. <b>I, you, we, they</b> ile yalın fiil kullanılır: they <b>go</b>.</p><p>Be fiili: I <b>am</b>, he/she/it <b>is</b>, you/we/they <b>are</b>. Geçmiş: I/he/she/it <b>was</b>, you/we/they <b>were</b>.</p><p>Ünsüz sesten önce <b>a</b>, ünlü sesten önce <b>an</b>: a book, an apple.</p>'],
[1,'Contractions & punctuation','Kısaltmalar ve noktalama','<p>A contraction joins two words. The apostrophe marks missing letters: do not → <b>don’t</b>, I am → <b>I’m</b>, it is → <b>it’s</b>.</p><p><b>its</b> = belongs to it. <b>it’s</b> = it is. <b>your</b> = belongs to you. <b>you’re</b> = you are.</p><p>A question ends with <b>?</b>. Use commas between list items: apples, bananas, and pears.</p>','<p>Kısaltma iki kelimeyi birleştirir. Kesme işareti eksik harfleri gösterir: do not → <b>don’t</b>, I am → <b>I’m</b>, it is → <b>it’s</b>.</p><p><b>its</b> = onun (sahiplik). <b>it’s</b> = it is. <b>your</b> = senin. <b>you’re</b> = you are.</p><p>Soru <b>?</b> ile biter. Liste öğeleri virgülle ayrılır: apples, bananas, and pears.</p>'],
[2,'Learning new words','Yeni kelime öğrenme','<p>New words stick when you use them. Say the word, write it, then make your own sentence. Here you see the Turkish meaning and pick the English word.</p>','<p>Yeni kelimeler kullandıkça aklında kalır. Kelimeyi söyle, yaz, sonra kendi cümleni kur. Burada Türkçe anlamı görüp İngilizce kelimeyi seçeceksin.</p>'],
[3,'Hearing and spelling','Duy ve yaz','<p>Break long words into parts: <b>beau·ti·ful</b>, <b>dif·fer·ent</b>. Press 🐢 to hear a word slowly, and say each part out loud before you type.</p>','<p>Uzun kelimeleri parçalara böl: <b>beau·ti·ful</b>, <b>dif·fer·ent</b>. Yavaş duymak için 🐢’ya bas ve yazmadan önce her parçayı yüksek sesle söyle.</p>'],
[4,'Spelling tricks','Yazım hileleri','<p><b>fri-END</b>: a friend is there at the end. <b>Necessary</b>: one c, two s. <b>Separate</b> has “a rat” in it. <b>i before e, except after c</b>: rec<b>ei</b>ve, bel<b>ie</b>ve.</p>','<p><b>fri-END</b>: arkadaş sonuna kadar yanındadır. <b>Necessary</b>: bir c, iki s. <b>Separate</b> içinde “a rat” var. <b>i, c’den sonra hariç e’den önce gelir</b>: rec<b>ei</b>ve, bel<b>ie</b>ve.</p>'],
[5,'Word chunks','Kelime parçaları','<p>Look for familiar chunks: <b>-tion</b>, <b>-ing</b>, <b>-ful</b>, <b>-ment</b>. Find the first letter and the ending, then fill in the middle.</p>','<p>Tanıdık parçaları ara: <b>-tion</b>, <b>-ing</b>, <b>-ful</b>, <b>-ment</b>. Önce ilk harfi ve sonu bul, ortayı doldur.</p>'],
[6,'English word order','İngilizce cümle sırası','<p><b>Subject + verb + object</b>: I read books. Questions: <b>question word + do/does + subject + verb</b>: Where do you live? Time words like <b>every day</b> usually go at the end.</p>','<p><b>Özne + fiil + nesne</b>: I read books. Sorular: <b>soru kelimesi + do/does + özne + fiil</b>: Where do you live? <b>every day</b> gibi zaman ifadeleri genelde sonda durur.</p>'],
[7,'The main tenses','Temel zamanlar','<p><b>Present simple</b>: habits: I walk. <b>Present continuous</b>: now: I am walking. <b>Past simple</b>: finished: I walked. <b>Present perfect</b>: have/has + past participle: I have walked. <b>Future</b>: will + verb: I will walk.</p>','<p><b>Geniş zaman</b>: alışkanlık: I walk. <b>Şimdiki zaman</b>: I am walking. <b>Geçmiş zaman</b>: I walked. <b>Present perfect</b>: have/has + fiilin 3. hali: I have walked. <b>Gelecek</b>: will + fiil: I will walk.</p>'],
[8,'at, on, in','at, on, in','<p><b>at</b> a point: at 5 pm, at school. <b>on</b> days and surfaces: on Monday, on the table. <b>in</b> months, years, places: in May, in 2024, in Turkey. Movement: <b>to</b> school, <b>from</b> home.</p>','<p><b>at</b> nokta: at 5 pm, at school. <b>on</b> günler ve yüzeyler: on Monday, on the table. <b>in</b> aylar, yıllar, yerler: in May, in 2024, in Turkey. Hareket: <b>to</b> school, <b>from</b> home.</p>'],
[9,'Words that sound alike','Benzer duyulan kelimeler','<p><b>their</b> (belongs to them), <b>there</b> (place), <b>they’re</b> (they are). <b>to</b> (direction), <b>too</b> (also / very), <b>two</b> (2). <b>affect</b> is a verb, <b>effect</b> is a noun.</p>','<p><b>their</b> (onlara ait), <b>there</b> (orada), <b>they’re</b> (they are). <b>to</b> (yön), <b>too</b> (de / çok), <b>two</b> (2). <b>affect</b> fiildir, <b>effect</b> isimdir.</p>'],
[10,'Polite everyday English','Kibar günlük İngilizce','<p>Polite requests: <b>Could you…, please?</b> Thanks: <b>Thank you</b> → <b>You’re welcome</b>. If you didn’t hear: <b>Could you repeat that, please?</b> Greetings: good morning, good afternoon, good evening.</p>','<p>Kibar rica: <b>Could you…, please?</b> Teşekkür: <b>Thank you</b> → <b>You’re welcome</b>. Duymadıysan: <b>Could you repeat that, please?</b> Selamlaşma: good morning, good afternoon, good evening.</p>'],
[11,'Irregular verbs','Düzensiz fiiller','<p>Some verbs change completely: go → <b>went</b> → <b>gone</b>. Learn them in groups. Type the past simple (2nd form) or the past participle (3rd form).</p>','<p>Bazı fiiller tamamen değişir: go → <b>went</b> → <b>gone</b>. Onları gruplar halinde öğren. Geçmiş zamanı (2. hal) ya da 3. hali yaz.</p>'],
[12,'Reading for answers','Cevap için okuma','<p>Read the whole text once, then read each question. Look for the key words from the question in the text. The answer is always in the text.</p>','<p>Metni bir kez baştan sona oku, sonra soruları oku. Sorudaki anahtar kelimeleri metinde ara. Cevap her zaman metindedir.</p>'],
[13,'Numbers and time','Sayılar ve zaman','<p>Numbers: thirteen (13), thirty (30). Ordinals: first, second, third, fourth. Time: <b>half past</b> = :30, <b>quarter to</b> = çeyrek var (:45), <b>o’clock</b> = exact hour.</p>','<p>Sayılar: thirteen (13), thirty (30). Sıra sayıları: first, second, third, fourth. Saat: <b>half past</b> = :30, <b>quarter to</b> = çeyrek var (:45), <b>o’clock</b> = tam saat.</p>']];
